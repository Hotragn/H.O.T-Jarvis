[package]
name = "hot-jarvis"
version = "0.1.0"
description = "H.O.T-Jarvis — a local-first, genuinely-free personal AI assistant"
authors = ["Hotragn Pettugani"]
license = "Apache-2.0"
repository = "https://github.com/Hotragn/H.O.T-Jarvis"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hot_jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Local speech-to-text (Whisper) runs entirely on-device. It's opt-in because
# it pulls a pure-Rust ML stack (a few minutes of extra build time) and needs a
# one-time model download. Everything else works without it, and the app tells
# the user honestly which mode they're in.
default = []
local-whisper = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
dotenvy = "0.15"
sysinfo = "0.33"
rhai = "1"

# Whisper inference, enabled by the `local-whisper` feature. candle is Hugging
# Face's Rust ML framework. It needs no cmake and no LLVM/libclang, which is the
# reason it's here instead of whisper.cpp bindings (those require all three, and
# `LIBCLANG_PATH` set). It is NOT C-free, though: candle-core pulls
# tokenizers 0.22 with default features, which builds Oniguruma (`onig_sys`) from
# C, so a C compiler is required. Our direct tokenizers dep still opts into the
# pure-Rust regex engine; feature unification means that can't remove the
# transitive copy, only avoid adding a second reason for it.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = [
  "fancy-regex",
] }

# Desktop-only stack, excluded from mobile (iOS/Android) builds:
#   * tray + global hotkey + launch-at-login (ambient presence, §6.5)
#   * cpal microphone capture (WASAPI / CoreAudio / ALSA), which otherwise drags
#     oboe/ndk/jni into mobile builds for a feature mobile doesn't use — iOS will
#     use a native AVAudioSession path instead (see docs/ios/README.md).
# Note: this must be a built-in target cfg — Cargo can't see Tauri's `desktop`
# rustc cfg here, so we spell out "not mobile" explicitly.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
cpal = "0.15"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
